fixes:
  - cve: CVE-2026-111181
    upstream_fix_url: https://github.com/expressjs/body-parser/commit/1260c3845f54502a05a87594f09a334786bb34d7
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2026-111181
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-body-parser/commit/48c8c49
    basis: adapted
    artifacts:
      - body-parser
    note: "Carried from 1.19.3-backpatch-00001; upstream's fix in 1.20.9, adapted to 1.19.2. It closes the advisory: body-parser vulnerable to Denial of Service via trailing bytes after a compressed request body. As upstream's fix, this release adds the runtime dependencies destroy (~1.2.0) and unpipe (~1.0.0) to package.json; shipped as upstream has it."
  - cve: CVE-2024-45590
    upstream_fix_url: https://github.com/expressjs/body-parser/commit/b2695c4450f06ba3b0ccf48d872a229bb41c9bce
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2024-45590
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-body-parser/commit/95fa033
    basis: adapted
    artifacts:
      - body-parser
    note: "Carried from 1.19.3-backpatch-00002; upstream's fix in 1.20.3, adapted to 1.19.2. It closes the advisory: body-parser vulnerable to denial of service when url encoding is enabled. As upstream's fix, this release raises the runtime dependency qs from 6.9.7 to 6.13.0 in package.json (its strictDepth option); shipped as upstream has it."
  - cve: CVE-2026-12590
    upstream_fix_url: https://github.com/expressjs/body-parser/commit/3492672eee593d5c158f239b6e9115498a5dbeac
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2026-12590
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-body-parser/commit/2d61c5b
    basis: backport
    artifacts:
      - body-parser
    note: "New in this release; upstream's fix in 1.20.6. It closes the advisory: body-parser vulnerable to denial of service when invalid limit value silently disables size enforcement."
